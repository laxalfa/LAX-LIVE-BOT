services:
  - type: web
    name: lax-live-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_SECRETS_JSON
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: DATABASE_PATH
        value: /opt/render/project/src/bot.sqlite3
